<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>小药箱 · 药品记录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f5f7fa;min-height:100vh;display:flex;justify-content:center;padding:16px 12px 40px}
.app-container{max-width:800px;width:100%}
.app-header{margin-bottom:20px}
.app-header h1{font-size:1.9rem;font-weight:600;color:#1e293b;display:flex;align-items:center;gap:8px}
.app-header h1 span{font-size:2rem}
.subhead{color:#64748b;margin-top:4px;font-size:0.95rem;border-left:4px solid #3b82f6;padding-left:12px;background:#ffffffcc;border-radius:0 8px 8px 0;line-height:1.4}
.stats-bar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 20px}
.stat-item{background:white;padding:8px 16px;border-radius:30px;box-shadow:0 2px 6px rgba(0,0,0,0.03);font-size:0.9rem;color:#334155;display:flex;align-items:center;gap:6px}
.stat-item .badge{background:#e2e8f0;padding:2px 10px;border-radius:20px;font-weight:600;color:#1e293b;font-size:0.85rem}
.form-card{background:white;border-radius:24px;padding:22px 20px;box-shadow:0 8px 20px rgba(0,0,0,0.04);margin-bottom:28px;border:1px solid #eef2f6}
.form-title{font-size:1.2rem;font-weight:600;margin-bottom:18px;color:#0f172a;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
@media(max-width:500px){.form-grid{grid-template-columns:1fr;gap:12px}}
.input-group{display:flex;flex-direction:column;gap:5px}
.input-group label{font-size:0.83rem;font-weight:500;color:#475569;letter-spacing:0.3px;display:flex;align-items:center;gap:5px}
.input-group label .required{color:#ef4444;font-size:1rem;line-height:1}
.input-group input,.input-group textarea,.input-group select{padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:14px;font-size:0.95rem;font-family:inherit;transition:0.2s;background:#fafcff;resize:vertical}
.input-group textarea{min-height:70px}
.input-group input:focus,.input-group textarea:focus,.input-group select:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.1);background:#ffffff}
.full-width{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
.btn{border:none;padding:12px 24px;border-radius:40px;font-weight:600;font-size:0.95rem;cursor:pointer;transition:0.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;background:white;border:1.5px solid transparent}
.btn-primary{background:#2563eb;color:white;box-shadow:0 6px 14px rgba(37,99,235,0.2)}
.btn-primary:hover{background:#1d4ed8;transform:translateY(-1px)}
.btn-secondary{background:white;border-color:#cbd5e1;color:#334155}
.btn-secondary:hover{background:#f8fafc;border-color:#94a3b8}
.btn-small{padding:6px 12px;font-size:0.8rem;border-radius:30px}
.btn-danger{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.btn-danger:hover{background:#fecaca;border-color:#fca5a5}
.btn-edit{background:#e0f2fe;color:#0369a1;border-color:#bae6fd}
.btn-edit:hover{background:#bae6fd;border-color:#7dd3fc}
.tool-bar{background:white;border-radius:20px;padding:12px 16px;margin-bottom:16px;box-shadow:0 3px 12px rgba(0,0,0,0.02);border:1px solid #eef2f6;display:flex;flex-direction:column;gap:12px}
.search-row{display:flex;align-items:center;gap:10px}
.search-row .search-icon{font-size:1.1rem;color:#94a3b8}
.search-row input{flex:1;border:none;outline:none;font-size:0.95rem;font-family:inherit;background:transparent;color:#1e293b}
.search-row input::placeholder{color:#94a3b8}
.backup-row{display:flex;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px dashed #e2e8f0}
.backup-row .btn{padding:8px 14px;font-size:0.82rem;border-radius:30px}
.list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.list-header h2{font-size:1.3rem;font-weight:600;color:#0f172a;display:flex;align-items:center;gap:8px}
.medicine-card{background:white;border-radius:20px;padding:16px 18px;box-shadow:0 3px 12px rgba(0,0,0,0.02);border:1px solid #eef2f6;transition:0.15s;display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;position:relative;margin-bottom:12px}
.medicine-card:hover{border-color:#d9e2ef;box-shadow:0 6px 16px rgba(0,0,0,0.03)}
.med-info{flex:1;min-width:200px}
.med-name{font-size:1.15rem;font-weight:700;color:#0f172a;margin-bottom:6px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.med-indication{color:#334155;font-size:0.9rem;line-height:1.5;margin-bottom:8px;background:#f1f5f9;padding:6px 10px;border-radius:12px;word-break:break-word}
.med-meta{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:0.85rem;color:#475569;margin-top:6px}
.med-meta .meta-item{display:flex;align-items:center;gap:5px}
.expiry-badge{background:#e6f7ec;color:#0b5e42;padding:2px 10px;border-radius:30px;font-weight:500;font-size:0.8rem}
.expiry-warning{background:#fff3cd;color:#856404}
.expiry-danger{background:#f8d7da;color:#721c24}
.quantity-badge{background:#eef2ff;color:#3730a3;padding:2px 10px;border-radius:30px;font-weight:500;font-size:0.8rem}
.quantity-low{background:#fee2e2;color:#991b1b}
.med-actions{display:flex;gap:6px;margin-left:auto}
.empty-state{background:white;border-radius:24px;padding:44px 20px;text-align:center;color:#94a3b8;border:2px dashed #e2e8f0;font-size:1rem}
.empty-state span{font-size:2.4rem;display:block;margin-bottom:8px;opacity:0.6}
.toast-message{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:10px 22px;border-radius:40px;font-size:0.9rem;box-shadow:0 10px 20px rgba(0,0,0,0.1);opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:100;white-space:nowrap}
.toast-message.show{opacity:1}
.footer-note{text-align:center;font-size:0.75rem;color:#94a3b8;margin-top:28px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.5);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-overlay.show{display:flex}
.modal-box{background:white;border-radius:24px;padding:22px 20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
.modal-title{font-size:1.15rem;font-weight:600;color:#0f172a;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:#f1f5f9;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:1.1rem;color:#475569;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:#e2e8f0}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.modal-actions .btn{padding:10px 20px;font-size:0.9rem}
.import-textarea{width:100%;min-height:140px;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:14px;font-size:0.85rem;font-family:monospace;background:#fafcff;resize:vertical}
.import-textarea:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
</style>
</head>
<body>

<div class="app-container">
<div class="app-header">
<h1><span>💊</span> 小药箱</h1>
<div class="subhead">记录手头药品 · 适应症 · 到期日 · 余量</div>
</div>

<div class="stats-bar">
<div class="stat-item">📦 药品总数 <span class="badge" id="totalCount">0</span></div>
<div class="stat-item">⏳ 即将过期 <span class="badge" id="expiringCount">0</span></div>
<div class="stat-item">⚠️ 余量不足 <span class="badge" id="lowStockCount">0</span></div>
</div>

<div class="form-card">
<div class="form-title"><span>➕</span> 添加新药品</div>
<form id="medicineForm">
<div class="form-grid">
<div class="input-group">
<label>药品名称 <span class="required">*</span></label>
<input type="text" id="medName" placeholder="例如：布洛芬缓释胶囊" required maxlength="60" autocomplete="off">
</div>
<div class="input-group">
<label>到期日</label>
<input type="date" id="medExpiry" value="">
</div>
<div class="input-group">
<label>余量数量</label>
<input type="number" id="medQuantity" placeholder="例如：12" min="0" step="1" autocomplete="off">
</div>
<div class="input-group">
<label>余量单位</label>
<select id="medUnit">
<option value="片">片</option>
<option value="盒">盒</option>
<option value="粒">粒</option>
<option value="袋">袋</option>
<option value="支">支</option>
<option value="ml">ml</option>
<option value="mg">mg</option>
<option value="瓶">瓶</option>
</select>
</div>
<div class="input-group full-width">
<label>适应症 / 功效</label>
<textarea id="medIndication" placeholder="例如：用于缓解轻至中度疼痛，如头痛、关节痛、牙痛等" rows="2" maxlength="200"></textarea>
</div>
</div>
<div class="form-actions">
<button type="button" class="btn btn-secondary" id="resetFormBtn">清空</button>
<button type="submit" class="btn btn-primary">💾 保存药品</button>
</div>
</form>
</div>

<div class="tool-bar">
<div class="search-row">
<span class="search-icon">🔍</span>
<input type="text" id="searchInput" placeholder="搜索药品名称…" autocomplete="off">
</div>
<div class="backup-row">
<button class="btn btn-secondary" id="exportBtn">📤 导出备份</button>
<button class="btn btn-secondary" id="importBtn">📥 导入备份</button>
</div>
</div>

<div class="list-header">
<h2><span>📋</span> 我的药品清单</h2>
<button class="btn btn-secondary btn-small" id="clearAllBtn">🗑️ 全部删除</button>
</div>

<div id="medicineListContainer"></div>
<div class="footer-note">数据保存在浏览器本地，关闭页面不会丢失</div>
</div>

<div class="modal-overlay" id="editModal">
<div class="modal-box">
<div class="modal-title"><span>✏️ 编辑药品</span><button class="modal-close" id="editCloseBtn">✕</button></div>
<form id="editForm">
<input type="hidden" id="editId">
<div class="form-grid">
<div class="input-group full-width">
<label>药品名称 <span class="required">*</span></label>
<input type="text" id="editName" required maxlength="60">
</div>
<div class="input-group">
<label>到期日</label>
<input type="date" id="editExpiry">
</div>
<div class="input-group">
<label>余量数量</label>
<input type="number" id="editQuantity" min="0" step="1">
</div>
<div class="input-group">
<label>余量单位</label>
<select id="editUnit">
<option value="片">片</option>
<option value="盒">盒</option>
<option value="粒">粒</option>
<option value="袋">袋</option>
<option value="支">支</option>
<option value="ml">ml</option>
<option value="mg">mg</option>
<option value="瓶">瓶</option>
</select>
</div>
<div class="input-group full-width">
<label>适应症 / 功效</label>
<textarea id="editIndication" rows="2" maxlength="200"></textarea>
</div>
</div>
<div class="modal-actions">
<button type="button" class="btn btn-secondary" id="editCancelBtn">取消</button>
<button type="submit" class="btn btn-primary">💾 保存修改</button>
</div>
</form>
</div>
</div>

<div class="modal-overlay" id="importModal">
<div class="modal-box">
<div class="modal-title"><span>📥 导入备份</span><button class="modal-close" id="importCloseBtn">✕</button></div>
<p style="font-size:0.85rem;color:#64748b;margin-bottom:10px;">把之前导出的备份文字粘贴到下面，点「确认导入」。⚠️ 导入会覆盖当前所有药品。</p>
<textarea class="import-textarea" id="importTextarea" placeholder="在此粘贴备份内容…"></textarea>
<div class="modal-actions">
<button type="button" class="btn btn-secondary" id="importCancelBtn">取消</button>
<button type="button" class="btn btn-primary" id="importConfirmBtn">📥 确认导入</button>
</div>
</div>
</div>

<div id="toast" class="toast-message"></div>

<script>
(function(){
var STORAGE_KEY='medicine_box_items';
var medicines=[];
var form=document.getElementById('medicineForm');
var medNameInput=document.getElementById('medName');
var medExpiryInput=document.getElementById('medExpiry');
var medQuantityInput=document.getElementById('medQuantity');
var medUnitSelect=document.getElementById('medUnit');
var medIndicationInput=document.getElementById('medIndication');
var resetBtn=document.getElementById('resetFormBtn');
var clearAllBtn=document.getElementById('clearAllBtn');
var listContainer=document.getElementById('medicineListContainer');
var totalCountSpan=document.getElementById('totalCount');
var expiringCountSpan=document.getElementById('expiringCount');
var lowStockCountSpan=document.getElementById('lowStockCount');
var searchInput=document.getElementById('searchInput');
var toastEl=document.getElementById('toast');
var editModal=document.getElementById('editModal');
var editForm=document.getElementById('editForm');
var editId=document.getElementById('editId');
var editName=document.getElementById('editName');
var editExpiry=document.getElementById('editExpiry');
var editQuantity=document.getElementById('editQuantity');
var editUnit=document.getElementById('editUnit');
var editIndication=document.getElementById('editIndication');
var editCloseBtn=document.getElementById('editCloseBtn');
var editCancelBtn=document.getElementById('editCancelBtn');
var importModal=document.getElementById('importModal');
var importTextarea=document.getElementById('importTextarea');
var importBtn=document.getElementById('importBtn');
var exportBtn=document.getElementById('exportBtn');
var importCloseBtn=document.getElementById('importCloseBtn');
var importCancelBtn=document.getElementById('importCancelBtn');
var importConfirmBtn=document.getElementById('importConfirmBtn');
var currentSearch='';

function generateId(){return Date.now()+'-'+Math.random().toString(36).substring(2,9);}
var toastTimer=null;
function showToast(msg,duration){duration=duration||2000;if(toastTimer)clearTimeout(toastTimer);toastEl.textContent=msg;toastEl.classList.add('show');toastTimer=setTimeout(function(){toastEl.classList.remove('show');},duration);}
function formatExpiryDate(s){if(!s)return '未设置';try{var d=new Date(s);if(isNaN(d.getTime()))return s;return d.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'});}catch(e){return s;}}
function daysUntilExpiry(s){if(!s)return null;var today=new Date();today.setHours(0,0,0,0);var exp=new Date(s);if(isNaN(exp.getTime()))return null;exp.setHours(0,0,0,0);return Math.ceil((exp-today)/(1000*60*60*24));}
function getExpiryStatus(s){if(!s)return{className:'',text:'未设置'};var d=daysUntilExpiry(s);if(d===null)return{className:'',text:'未知'};if(d<0)return{className:'expiry-danger',text:'已过期 '+(-d)+' 天'};if(d===0)return{className:'expiry-danger',text:'今天到期'};if(d<=90)return{className:'expiry-warning',text:'剩余 '+d+' 天'};return{className:'',text:'剩余 '+d+' 天'};}
function updateStats(){totalCountSpan.textContent=medicines.length;var e=0,l=0;medicines.forEach(function(m){var d=daysUntilExpiry(m.expiryDate);if(d!==null&&d<=90)e++;var q=parseInt(m.quantity,10);if(!isNaN(q)&&q>=0&&q<=5)l++;});expiringCountSpan.textContent=e;lowStockCountSpan.textContent=l;}
function saveToLocalStorage(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(medicines));}catch(e){showToast('保存失败，存储可能已满');}}
function loadFromLocalStorage(){try{var s=localStorage.getItem(STORAGE_KEY);if(s){var p=JSON.parse(s);medicines=Array.isArray(p)?p:[];}else{medicines=[{id:generateId(),name:'布洛芬缓释胶囊',indication:'用于缓解轻至中度疼痛，如头痛、关节痛、牙痛，也用于普通感冒引起的发热。',expiryDate:'2026-12-31',quantity:'8',unit:'片'},{id:generateId(),name:'阿莫西林胶囊',indication:'适用于敏感菌所致的呼吸道感染、泌尿生殖道感染等。',expiryDate:'2025-08-15',quantity:'2',unit:'盒'}];saveToLocalStorage();}}catch(e){medicines=[];}medicines=medicines.map(function(m){return Object.assign({},m,{id:m.id||generateId(),quantity:m.quantity==null?'':m.quantity,unit:m.unit||'片'});});saveToLocalStorage();}
function escapeHtml(t){if(!t)return '';var d=document.createElement('div');d.textContent=t;return d.innerHTML;}

function render(){
updateStats();
var k=currentSearch.trim().toLowerCase();
var filtered=medicines;
if(k){filtered=medicines.filter(function(m){return (m.name||'').toLowerCase().indexOf(k)>=0;});}
if(!filtered.length){
if(k){listContainer.innerHTML='<div class="empty-state"><span>🔍</span>没有找到「'+escapeHtml(currentSearch)+'」相关的药品</div>';}
else{listContainer.innerHTML='<div class="empty-state"><span>📭</span>还没有药品记录，点击上方表单添加吧</div>';}
return;
}
var sorted=filtered.slice().sort(function(a,b){var da=daysUntilExpiry(a.expiryDate);var db=daysUntilExpiry(b.expiryDate);return (da===null?Infinity:da)-(db===null?Infinity:db);});
var html='';
sorted.forEach(function(m){
var st=getExpiryStatus(m.expiryDate);
var disp=formatExpiryDate(m.expiryDate);
var ind=m.indication&&m.indication.trim()?m.indication:'（未填写适应症）';
var qn=parseInt(m.quantity,10);
var qd='',qc='quantity-badge';
if(m.quantity===''||m.quantity==null){qd='未记录';}
else if(!isNaN(qn)){qd=qn+' '+(m.unit||'片');if(qn<=5)qc='quantity-badge quantity-low';}
else{qd=m.quantity+' '+(m.unit||'片');}
html+='<div class="medicine-card" data-id="'+m.id+'">'
+'<div class="med-info">'
+'<div class="med-name">💊 '+escapeHtml(m.name)+'</div>'
+'<div class="med-indication">'+escapeHtml(ind)+'</div>'
+'<div class="med-meta">'
+'<span class="meta-item">📅 到期: '+disp+'</span>'
+'<span class="expiry-badge '+st.className+'">'+st.text+'</span>'
+'<span class="'+qc+'">📦 '+qd+'</span>'
+'</div></div>'
+'<div class="med-actions">'
+'<button class="btn btn-edit btn-small edit-btn" data-id="'+m.id+'">✏️ 编辑</button>'
+'<button class="btn btn-danger btn-small delete-btn" data-id="'+m.id+'">删除</button>'
+'</div></div>';
});
listContainer.innerHTML=html;
}

function deleteMedicineById(id){var m=medicines.find(function(x){return x.id===id;});if(!m)return;if(confirm('确定要删除「'+(m.name||'该药品')+'」吗？')){medicines=medicines.filter(function(x){return x.id!==id;});saveToLocalStorage();render();showToast('已删除 '+m.name);}}
function openEditModal(id){var m=medicines.find(function(x){return x.id===id;});if(!m)return;editId.value=m.id;editName.value=m.name||'';editExpiry.value=m.expiryDate||'';editQuantity.value=m.quantity||'';editUnit.value=m.unit||'片';editIndication.value=m.indication||'';editModal.classList.add('show');}
function closeEditModal(){editModal.classList.remove('show');}
function addMedicine(n,i,e,q,u){medicines.push({id:generateId(),name:n.trim(),indication:i.trim(),expiryDate:e?e.trim():'',quantity:q?q.trim():'',unit:u||'片'});saveToLocalStorage();render();}
function resetForm(){medNameInput.value='';medExpiryInput.value='';medQuantityInput.value='';medUnitSelect.value='片';medIndicationInput.value='';medNameInput.focus();}
function clearAllMedicines(){if(!medicines.length){showToast('列表已经是空的');return;}if(confirm('⚠️ 确定要删除全部药品记录吗？此操作不可撤销。')){medicines=[];saveToLocalStorage();render();showToast('已清空所有药品');resetForm();}}

function exportData(){if(!medicines.length){showToast('没有数据可导出');return;}var obj={version:1,exportDate:new Date().toISOString(),medicines:medicines};var text=JSON.stringify(obj,null,2);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){showToast('✅ 已复制到剪贴板');}).catch(function(){fallbackCopy(text);});}else{fallbackCopy(text);}}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='-9999px';document.body.appendChild(ta);ta.select();try{var ok=document.execCommand('copy');if(ok)showToast('✅ 已复制到剪贴板');else prompt('复制下面的内容保存到备忘录：',text);}catch(e){prompt('复制下面的内容保存到备忘录：',text);}finally{document.body.removeChild(ta);}}
function openImportModal(){importTextarea.value='';importModal.classList.add('show');}
function closeImportModal(){importModal.classList.remove('show');}
function doImport(){var text=importTextarea.value.trim();if(!text){showToast('请先粘贴备份内容');return;}var parsed;try{parsed=JSON.parse(text);}catch(e){showToast('❌ 内容格式不对');return;}var arr=null;if(Array.isArray(parsed))arr=parsed;else if(parsed&&Array.isArray(parsed.medicines))arr=parsed.medicines;if(!arr){showToast('❌ 找不到药品数据');return;}arr=arr.map(function(m){return {id:m.id||generateId(),name:m.name||'未命名药品',indication:m.indication||'',expiryDate:m.expiryDate||'',quantity:m.quantity==null?'':m.quantity,unit:m.unit||'片'};});if(!confirm('即将导入 '+arr.length+' 条药品记录，当前已有的 '+medicines.length+' 条会被覆盖。确定继续吗？'))return;medicines=arr;saveToLocalStorage();render();closeImportModal();showToast('✅ 已导入 '+arr.length+' 条药品');}

form.addEventListener('submit',function(e){e.preventDefault();var n=medNameInput.value.trim();if(!n){showToast('请填写药品名称');medNameInput.focus();return;}addMedicine(n,medIndicationInput.value.trim(),medExpiryInput.value,medQuantityInput.value,medUnitSelect.value);resetForm();showToast('✅ 药品已保存');});
resetBtn.addEventListener('click',resetForm);
clearAllBtn.addEventListener('click',clearAllMedicines);
searchInput.addEventListener('input',function(e){currentSearch=e.target.value;render();});
listContainer.addEventListener('click',function(e){var eb=e.target.closest('.edit-btn');if(eb){e.stopPropagation();openEditModal(eb.dataset.id);return;}var db=e.target.closest('.delete-btn');if(db){e.stopPropagation();deleteMedicineById(db.dataset.id);}});
editCloseBtn.addEventListener('click',closeEditModal);
editCancelBtn.addEventListener('click',closeEditModal);
editForm.addEventListener('submit',function(e){e.preventDefault();var id=editId.value;var m=medicines.find(function(x){return x.id===id;});if(!m)return;m.name=editName.value.trim();m.expiryDate=editExpiry.value;m.quantity=editQuantity.value;m.unit=editUnit.value;m.indication=editIndication.value.trim();saveToLocalStorage();render();closeEditModal();showToast('✅ 已保存修改');});
importBtn.addEventListener('click',openImportModal);
importCloseBtn.addEventListener('click',closeImportModal);
importCancelBtn.addEventListener('click',closeImportModal);
importConfirmBtn.addEventListener('click',doImport);
exportBtn.addEventListener('click',exportData);

loadFromLocalStorage();
render();
window.addEventListener('beforeunload',saveToLocalStorage);
})();
</script>
</body>
</html>
